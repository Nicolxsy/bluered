[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluered-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bluered-contracts",
    "aiosqlite>=0.20",
    "websockets>=14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["bluered_client"]
