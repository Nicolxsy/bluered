services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bluered
      POSTGRES_PASSWORD: bluered_dev
      POSTGRES_DB: bluered
    ports:
      - "5432:5432"
    volumes:
      - bluered_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluered -d bluered"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bluered_pgdata: {}
